name: Validate Freedive UI

on:
  pull_request:
    branches: [main]
  push:
    branches: [design/polish-pass-1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared TypeScript libraries
        run: pnpm run typecheck:libs
      - name: Typecheck Freedive
        run: pnpm --filter @workspace/freelanceflow typecheck
      - name: Build Freedive
        run: pnpm --filter @workspace/freelanceflow build
        env:
          PORT: 5000
          BASE_PATH: /
